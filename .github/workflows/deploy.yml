name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build resource catalog
        run: python3 scripts/build.py
      - name: Validate the generated static site and live-check logic
        run: |
          python3 scripts/verify_site.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          git diff --exit-code -- site/index.html
      - name: Stamp deployment source commit
        run: printf '%s\n' "$GITHUB_SHA" > site/deployment-sha.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual public Pages content
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 scripts/verify_live_site.py --base-url "$PAGE_URL" --expected-sha "$COMMIT_SHA" --attempts 18 --delay-seconds 10
