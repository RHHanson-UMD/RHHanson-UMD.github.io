name: Validate static portal

on:
  pull_request:
    paths:
      - 'site/**'
      - 'content/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/verify-site.yml'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portal from canonical JSON
        run: python3 scripts/build.py
      - name: Check generated Pages files and local links
        run: python3 scripts/verify_site.py
      - name: Run offline live-deployment verification tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Ensure committed homepage matches generator output
        run: git diff --exit-code -- site/index.html
